name: Keep Alive

on:
  schedule:
    - cron: '*/25 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Ping FRM Standard ETF System
        run: |
          CODE=$(curl -sS -o /dev/null -w "%{http_code}"                  "https://frmetf-standard.streamlit.app/" || true)
          echo "HTTP $CODE at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
